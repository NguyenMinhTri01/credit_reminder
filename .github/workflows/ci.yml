name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/ci.yml'

  backend-check:
    name: Backend Checks
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend db:generate

      - name: TypeScript Check
        run: pnpm --filter backend typecheck

      - name: ESLint Check
        run: pnpm --filter backend lint

      - name: Unit Test & Coverage (>90%)
        run: pnpm --filter backend test:cov

      - name: Build Application
        run: pnpm --filter backend build

  frontend-check:
    name: Frontend Checks
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm --filter frontend typecheck

      - name: ESLint Check
        run: pnpm --filter frontend lint

      - name: Unit Test & Coverage (>90%)
        run: pnpm --filter frontend test:cov

      - name: Build Application
        run: pnpm --filter frontend build

  ci-gate:
    name: CI Gate
    needs:
      - changes
      - backend-check
      - frontend-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Check Results
        run: |
          backend_result="${{ needs.backend-check.result }}"
          frontend_result="${{ needs.frontend-check.result }}"

          echo "Backend check result:  $backend_result"
          echo "Frontend check result: $frontend_result"

          if [ "$backend_result" = "failure" ] || [ "$backend_result" = "cancelled" ] || \
             [ "$frontend_result" = "failure" ] || [ "$frontend_result" = "cancelled" ]; then
            echo "❌ One or more required checks failed or were cancelled!"
            exit 1
          fi

          echo "✅ All required CI checks passed (or were skipped because no relevant files changed)!"
          exit 0
